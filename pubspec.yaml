name: demo
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase dependencies
  firebase_core: ^3.5.0
  cloud_firestore: ^5.1.0
  firebase_auth: ^5.1.0
  firebase_storage: ^12.4.10

  # Other useful packages
  image_picker: ^0.8.7+5
  path_provider: ^2.0.15
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  video_player: ^2.9.4
  youtube_player_flutter: ^9.1.3
  url_launcher: ^6.2.5
  flutter_rating_bar: ^4.0.0
  http: ^1.1.0
  flutter_dotenv: ^5.1.0
  email_validator: ^2.1.17
  share_plus: ^10.0.2


  # Hive (local storage)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Hive generator (for custom objects)
  hive_generator: ^2.0.1
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/
